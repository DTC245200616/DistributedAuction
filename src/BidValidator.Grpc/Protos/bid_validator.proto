syntax = "proto3";

option csharp_namespace = "BidValidator.Grpc";

package bidvalidator;

service BidValidator {
  rpc ValidateBid (ValidateBidRequest) returns (ValidateBidReply);
}

message ValidateBidRequest {
  string bidder_name = 1;
  double bid_amount = 2;
  double current_price = 3;
  double min_step = 4;
  int64 end_time_unix = 5;
  int32 status = 6;
}

message ValidateBidReply {
  bool is_valid = 1;
  string message = 2;
}